name: Publish to npm

# Publishes with npm Trusted Publishing (OIDC) — no npm token, no NPM_TOKEN secret.
# Configured at npmjs.com -> @jiqinga/dsh-folding-windows -> Settings -> Trusted Publisher.
# Requires npm CLI >= 11.5.1 and Node >= 22.14.0 (Node 24 below covers both).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Required for OIDC. Do NOT add NODE_AUTH_TOKEN / NPM_TOKEN here — npm
  # detects the OIDC environment automatically and uses it first.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never cache in a release build: a restored cache can reintroduce a
          # dependency that no longer matches the lockfile.
          package-manager-cache: false

      # No `npm ci` on purpose: this package has no runtime dependencies, and
      # its only devDependency (playwright) drives the preview server, not the
      # build. Installing it would add ~100 MB and minutes to every publish.
      - name: Build the client bundle
        run: npm run build

      - name: Verify the bundle matches the source
        run: npm run check

      # Provenance is generated automatically under trusted publishing, so no
      # --provenance flag is needed.
      - name: Publish
        run: npm publish --access public
